<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Login — Meridian Implant Advisory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
</head>
<body>

<div id="header-slot"></div>

<section class="soft" style="padding:96px 0; min-height:70vh; display:flex; align-items:center;">
  <div class="container" style="max-width:440px;">
    <div class="card">
      <span class="eyebrow">Client Login</span>
      <h2 style="font-size:1.6rem;">Access your resources</h2>

      <div id="not-configured" style="display:none;">
        <p>The client portal isn't fully set up yet — check back soon, or <a href="/index.html#contact" style="color:var(--gold-dim); font-weight:600;">reach out directly</a> in the meantime.</p>
      </div>

      <div id="already-in" style="display:none;">
        <p style="margin:0 0 16px;">You're already signed in as <strong id="who"></strong>.</p>
        <a id="go-on" class="btn btn-primary" style="width:100%; justify-content:center;" href="/resources.html">Continue</a>
        <p style="margin:14px 0 0; font-size:0.85rem;">
          Not you? <a href="#" id="sign-out" style="color:var(--gold-dim); font-weight:600;">Sign out</a>
        </p>
      </div>

      <form id="login-form">
        <div class="field">
          <label for="li-email">Email</label>
          <input type="email" id="li-email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="li-password">Password</label>
          <input type="password" id="li-password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Log In</button>
        <p id="login-status" style="margin:14px 0 0; font-size:0.85rem;"></p>
        <p style="margin:12px 0 0; font-size:0.85rem;"><a href="/reset-password.html" style="color:var(--gold-dim); font-weight:600;">Forgot password?</a></p>
      </form>

      <p style="margin-top:24px; font-size:0.85rem; color:var(--text-faint);">Don't have an account? <a href="/index.html#contact" style="color:var(--gold-dim); font-weight:600;">Get in touch</a> to request access.</p>
    </div>
  </div>
</section>

<div id="footer-slot"></div>

<script src="/js/include.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/auth.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", async function () {
    var client = window.getSupabaseClient && window.getSupabaseClient();
    if (!client) {
      document.getElementById("not-configured").style.display = "block";
      document.getElementById("login-form").style.display = "none";
      return;
    }

    // A stale Supabase session used to bounce straight past this page, which made
    // the login link look "stuck" — there was no way to reach the form or to sign
    // in as anyone else. Now an existing session is SHOWN, with a way out of it.
    // /login.html?signout=1 forces a clean slate.
    var params = new URLSearchParams(window.location.search);
    if (params.get("signout")) {
      await window.MeridianAuth.hardLogout();
      window.location.replace("/login.html");
      return;
    }

    var user = await window.MeridianAuth.getSessionUser();
    if (user) {
      var profile = await window.MeridianAuth.getProfile(user.id);
      document.getElementById("login-form").style.display = "none";
      var box = document.getElementById("already-in");
      box.style.display = "block";
      document.getElementById("who").textContent = user.email;
      document.getElementById("go-on").href =
        (profile && profile.role === "admin") ? "/portal.html" : "/resources.html";
      document.getElementById("sign-out").addEventListener("click", async function (e) {
        e.preventDefault();
        await window.MeridianAuth.hardLogout();
        window.location.replace("/login.html");
      });
      return;
    }

    var form = document.getElementById("login-form");
    var status = document.getElementById("login-status");
    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      status.textContent = "Logging in...";
      status.style.color = "var(--text-faint)";
      var email = document.getElementById("li-email").value.trim();
      var password = document.getElementById("li-password").value;
      var { error } = await window.MeridianAuth.login(email, password);
      if (error) {
        status.textContent = error.message;
        status.style.color = "#B4423C";
      } else {
        // Ask the browser's password manager to offer to save these credentials.
        try {
          if (window.PasswordCredential && navigator.credentials) {
            var cred = new window.PasswordCredential({ id: email, password: password, name: email });
            await navigator.credentials.store(cred);
          }
        } catch (e) { /* non-fatal */ }
        // Admins land on the portal chooser; everyone else goes to resources.
        var u = await window.MeridianAuth.getSessionUser();
        var prof = u ? await window.MeridianAuth.getProfile(u.id) : null;
        window.location.href =
          (prof && prof.role === "admin") ? "/portal.html" : "/resources.html";
      }
    });
  });
</script>
</body>
</html>
