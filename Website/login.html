<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Login — Meridian Implant Advisory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
</head>
<body>

<div id="header-slot"></div>

<section class="soft" style="padding:96px 0; min-height:70vh; display:flex; align-items:center;">
  <div class="container" style="max-width:440px;">
    <div class="card">
      <span class="eyebrow">Client Login</span>
      <h2 style="font-size:1.6rem;">Access your resources</h2>

      <div id="not-configured" style="display:none;">
        <p>The client portal isn't fully set up yet — check back soon, or <a href="/index.html#contact" style="color:var(--gold-dim); font-weight:600;">reach out directly</a> in the meantime.</p>
      </div>

      <form id="login-form">
        <div class="field">
          <label for="li-email">Email</label>
          <input type="email" id="li-email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="li-password">Password</label>
          <input type="password" id="li-password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Log In</button>
        <p id="login-status" style="margin:14px 0 0; font-size:0.85rem;"></p>
        <p style="margin:12px 0 0; font-size:0.85rem;"><a href="/reset-password.html" style="color:var(--gold-dim); font-weight:600;">Forgot password?</a></p>
      </form>

      <p style="margin-top:24px; font-size:0.85rem; color:var(--text-faint);">Don't have an account? <a href="/index.html#contact" style="color:var(--gold-dim); font-weight:600;">Get in touch</a> to request access.</p>
    </div>
  </div>
</section>

<div id="footer-slot"></div>

<script src="/js/include.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/auth.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", async function () {
    var client = window.getSupabaseClient && window.getSupabaseClient();
    if (!client) {
      document.getElementById("not-configured").style.display = "block";
      document.getElementById("login-form").style.display = "none";
      return;
    }

    // Already logged in? Skip straight to resources.
    var user = await window.MeridianAuth.getSessionUser();
    if (user) { window.location.href = "/resources.html"; return; }

    var form = document.getElementById("login-form");
    var status = document.getElementById("login-status");
    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      status.textContent = "Logging in...";
      status.style.color = "var(--text-faint)";
      var email = document.getElementById("li-email").value.trim();
      var password = document.getElementById("li-password").value;
      var { error } = await window.MeridianAuth.login(email, password);
      if (error) {
        status.textContent = error.message;
        status.style.color = "#B4423C";
      } else {
        // Ask the browser's password manager to offer to save these credentials.
        try {
          if (window.PasswordCredential && navigator.credentials) {
            var cred = new window.PasswordCredential({ id: email, password: password, name: email });
            await navigator.credentials.store(cred);
          }
        } catch (e) { /* non-fatal */ }
        window.location.href = "/resources.html";
      }
    });
  });
</script>
</body>
</html>
