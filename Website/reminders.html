<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reminders — Meridian Implant Advisory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
<style>
  .rem-card { padding:16px 20px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; }
  .rem-when { color:var(--text-faint); font-size:0.83rem; margin-top:3px; }
  .wk { display:inline-flex; gap:6px; flex-wrap:wrap; }
  .wk label { display:inline-flex; align-items:center; gap:4px; font-size:0.82rem; margin:0; color:var(--text-soft); }
  .wk input { width:auto; }
</style>
</head>
<body>

<div id="header-slot"></div>
<div id="account-nav-slot"></div>

<section class="soft" id="loading" style="padding:96px 0; text-align:center;"><div class="container"><p>Loading...</p></div></section>
<section id="not-configured" style="display:none; padding:96px 0;"><div class="container narrow center"><h2>Not available yet</h2></div></section>

<section id="panel" style="display:none; padding:56px 0 100px;">
  <div class="container" style="max-width:820px;">
    <span class="eyebrow">Your Account</span>
    <h1 style="font-size:2.1rem;">Reminders</h1>
    <p style="color:var(--text-soft);">Automatic email (and optional calendar) nudges for goal &amp; KPI reviews and marketing tasks — like a quarterly "send out fishing letters." All times are Eastern.</p>

    <div class="card" style="margin:24px 0 40px;">
      <h3>Add a reminder</h3>
      <form id="rem-form">
        <div class="grid grid-2" style="gap:16px;">
          <div class="field">
            <label for="rf-title">Title</label>
            <input type="text" id="rf-title" required placeholder="e.g., Send out fishing letters">
          </div>
          <div class="field">
            <label for="rf-category">Type</label>
            <select id="rf-category">
              <option value="goals_kpi">Goals &amp; KPI review</option>
              <option value="marketing">Marketing channel</option>
              <option value="custom">Other</option>
            </select>
          </div>
        </div>
        <div class="grid grid-2" style="gap:16px;">
          <div class="field">
            <label for="rf-frequency">How often</label>
            <select id="rf-frequency">
              <option value="daily">Daily (choose days)</option>
              <option value="weekly">Weekly (Monday)</option>
              <option value="monthly">Monthly (1st)</option>
              <option value="quarterly">Quarterly (1st of Jan/Apr/Jul/Oct)</option>
              <option value="biannual">Twice a year (Jan 1 &amp; Jul 1)</option>
              <option value="custom">Custom days</option>
            </select>
          </div>
          <div class="field">
            <label for="rf-time">Time (ET)</label>
            <input type="time" id="rf-time" value="07:00">
          </div>
        </div>
        <div class="field" id="rf-weekdays-wrap">
          <label>On which days?</label>
          <div class="wk" id="rf-weekdays">
            <label><input type="checkbox" value="1">Mon</label>
            <label><input type="checkbox" value="2">Tue</label>
            <label><input type="checkbox" value="3">Wed</label>
            <label><input type="checkbox" value="4">Thu</label>
            <label><input type="checkbox" value="5">Fri</label>
            <label><input type="checkbox" value="6">Sat</label>
            <label><input type="checkbox" value="0">Sun</label>
          </div>
        </div>
        <div class="grid grid-2" style="gap:16px;">
          <div class="field">
            <label for="rf-channel">Send via</label>
            <select id="rf-channel">
              <option value="email">Email</option>
              <option value="both">Email + calendar invite</option>
              <option value="calendar">Calendar invite only</option>
            </select>
          </div>
          <div class="field">
            <label for="rf-email">Send to (email)</label>
            <input type="email" id="rf-email" placeholder="defaults to your login email">
          </div>
        </div>
        <div class="field">
          <label for="rf-notes">Note (optional — included in the reminder)</label>
          <input type="text" id="rf-notes" placeholder="e.g., pull the extraction/denture procedure-code list first">
        </div>
        <button type="submit" class="btn btn-primary">Add reminder</button>
        <p id="rf-status" style="margin:12px 0 0; font-size:0.85rem;"></p>
      </form>
    </div>

    <h3>Your reminders</h3>
    <div id="rem-list"></div>
  </div>
</section>

<div id="footer-slot"></div>

<script src="/js/include.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/reminder-schedule.js"></script>
<script src="/js/reminders.js"></script>
</body>
</html>
