<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Meridian Implant Advisory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
</head>
<body>

<div id="header-slot"></div>

<section class="soft" style="padding:96px 0; min-height:70vh; display:flex; align-items:center;">
  <div class="container" style="max-width:440px;">
    <div class="card">
      <span class="eyebrow">Client Login</span>

      <!-- Step 1: request a reset link -->
      <div id="request-view">
        <h2 style="font-size:1.6rem;">Reset your password</h2>
        <p style="font-size:0.9rem; color:var(--text-soft);">Enter your email and we'll send a secure link to reset your password.</p>
        <form id="request-form">
          <div class="field">
            <label for="rp-email">Email</label>
            <input type="email" id="rp-email" required autocomplete="username">
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Send reset link</button>
          <p id="request-status" style="margin:14px 0 0; font-size:0.85rem;"></p>
        </form>
        <p style="margin-top:22px; font-size:0.85rem;"><a href="/login.html" style="color:var(--gold-dim); font-weight:600;">← Back to log in</a></p>
      </div>

      <!-- Step 2: set a new password (shown after arriving from the email link) -->
      <div id="update-view" style="display:none;">
        <h2 style="font-size:1.6rem;">Choose a new password</h2>
        <p style="font-size:0.9rem; color:var(--text-soft);">Enter a new password for your account.</p>
        <form id="update-form">
          <div class="field">
            <label for="rp-new">New password</label>
            <input type="password" id="rp-new" required minlength="8" autocomplete="new-password">
          </div>
          <div class="field">
            <label for="rp-confirm">Confirm new password</label>
            <input type="password" id="rp-confirm" required minlength="8" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Update password</button>
          <p id="update-status" style="margin:14px 0 0; font-size:0.85rem;"></p>
        </form>
      </div>

      <div id="not-configured" style="display:none;">
        <p>The client portal isn't fully set up yet.</p>
      </div>
    </div>
  </div>
</section>

<div id="footer-slot"></div>

<script src="/js/include.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-config.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var client = window.getSupabaseClient && window.getSupabaseClient();
    if (!client) { document.getElementById("not-configured").style.display = "block"; document.getElementById("request-view").style.display = "none"; return; }

    var requestView = document.getElementById("request-view");
    var updateView = document.getElementById("update-view");

    // When the user arrives from the emailed link, Supabase fires PASSWORD_RECOVERY
    // and establishes a temporary session — switch to the "set new password" view.
    client.auth.onAuthStateChange(function (event) {
      if (event === "PASSWORD_RECOVERY") {
        requestView.style.display = "none";
        updateView.style.display = "";
      }
    });
    // Also handle the case where the recovery token is already in the URL on load.
    if (window.location.hash.indexOf("type=recovery") !== -1) {
      requestView.style.display = "none";
      updateView.style.display = "";
    }

    // Step 1 — send reset email
    document.getElementById("request-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      var status = document.getElementById("request-status");
      var email = document.getElementById("rp-email").value.trim();
      status.textContent = "Sending…"; status.style.color = "var(--text-faint)";
      var { error } = await client.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + "/reset-password.html"
      });
      if (error) { status.textContent = error.message; status.style.color = "#B4423C"; return; }
      status.textContent = "Check your email for a reset link. It may take a minute to arrive.";
      status.style.color = "#2E7D4F";
    });

    // Step 2 — set the new password
    document.getElementById("update-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      var status = document.getElementById("update-status");
      var pw = document.getElementById("rp-new").value;
      var confirm = document.getElementById("rp-confirm").value;
      if (pw !== confirm) { status.textContent = "Passwords don't match."; status.style.color = "#B4423C"; return; }
      status.textContent = "Updating…"; status.style.color = "var(--text-faint)";
      var { error } = await client.auth.updateUser({ password: pw });
      if (error) { status.textContent = error.message; status.style.color = "#B4423C"; return; }
      status.textContent = "Password updated. Redirecting to your resources…";
      status.style.color = "#2E7D4F";
      setTimeout(function () { window.location.href = "/resources.html"; }, 1200);
    });
  });
</script>
</body>
</html>
